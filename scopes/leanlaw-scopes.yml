observations:
- No write scope exists for invoices, balances or codes — those surfaces are read-only by design and
  the scope list reflects it.
- Trust accounts and settlements are explicitly excluded from the agent surface per
  https://platform.leanlaw.io/agents, and no scope is published for them.
- The `read:*` / `write:*` wildcards let a client request blanket access; a least-privilege
  integration should request the specific resource scopes instead.
