external_systems:
- name: QuickBooks Online
  relationship: two-way sync
  api_visible_effect: >-
    Per the 2026-08-17 changelog, CreateMatter can create a QuickBooks customer (for the client) and
    a sub-customer (for the matter) when the firm bills per matter. CreateClient alone does not reach
    QuickBooks.
  note: >-
    QuickBooks identifiers are not exposed as fields in the published LeanLaw schemas, so an API
    consumer cannot resolve a LeanLaw record to its QuickBooks counterpart through this contract.
shared_components:
  envelope_wrappers: [ClientDetailResponse, ClientListListResponse, ClientBalancesResponse, CodeListResponse,
    CustomFieldListIEnumerableResponse, ExpenseDetailResponse, ExpenseListListResponse, FixedFeeDetailResponse,
    FixedFeeListListResponse, InvoiceListListResponse, MatterDetailResponse, MatterListListResponse,
    PracticeAreaListIEnumerableResponse, PracticeAreaListResponse, TimeEntryDetailResponse,
    TimeEntryListListResponse, UserListIEnumerableResponse, UserListResponse]
  cross_cutting: [Pagination, Metadata, Contact, ConflictInformation]
  enums: [BillingType, CustomFieldEntityType, CustomFieldValueType, InvoiceState, MatterType, Role, HealthStatus]
  reference_types: [ClientReference, MatterReference, UserReference, InvoiceReference, FixedFeeReference, PracticeAreaReference]
  note: >-
    Every entity is modelled as a Detail/List pair plus a Reference type and a response wrapper — 74
    schemas for 11 entities. Reference types give consistent embedded-object shapes across the graph.
observations:
- The billable-item triad (TimeEntry / Expense / FixedFee) shares an almost identical shape
  (userId, matterId, clientId, invoiceId, meta) but is modelled as three parallel schema families
  rather than one polymorphic type.
- clientId is denormalized onto every billable item and invoice even though it is derivable through
  matterId, which makes client-scoped queries cheap but creates two paths to the same truth.
- Trust/IOLTA accounting and settlements are core LeanLaw product features but have NO representation
  in the published API — no schema, no path, no scope.
