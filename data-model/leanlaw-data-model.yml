source: openapi/leanlaw-api-openapi.json
also: https://platform.leanlaw.io/concepts
summary: >-
  LeanLaw's data core is a law-firm billing graph. Clients own matters; matters own the three kinds of
  billable item (time entries, expenses, fixed fees); billable items roll up into invoices. Users are
  assigned to matters as responsible attorney and originators, and time entries always carry a user.
  Practice areas classify matters, LEDES code sets classify billable work, and firm-defined custom
  fields decorate clients, matters and users.
identifier_scheme:
  internal: GUID (UUID)
  example: f3888fb4-1ca8-ef11-8474-6045bd06f3a2
  firm_facing_alias: reference
  reference_note: >-
    A separate `reference` property carries the firm's own "Client ID" / "Matter ID". It is optional,
    may exist on the client, the matter, both or neither, and must not be confused with the GUID.
  id_prefixes: none — ids are bare GUIDs with no type prefix
