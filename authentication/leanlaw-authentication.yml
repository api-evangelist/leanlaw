  sources:
  - openapi/leanlaw-api-openapi.json
  - https://platform.leanlaw.io/auth
  description: >-
    A LeanLaw API key presented as a bearer token. The key represents the ACCOUNT (the firm), not an
    individual user, and acts on behalf of the firm with the scopes selected when the key was created.
  provisioning:
    ui_path: Settings > API
    action: Generate API Key
    scope_selection: read or write permissions chosen per key at creation time
    display: shown once at creation; must be stored by the caller
