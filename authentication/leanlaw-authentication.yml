gaps:
- The API key is firm-scoped rather than user-scoped, so per-user attribution depends on the caller
  voluntarily sending x-leanlaw-userid.
- Neither x-leanlaw-userid nor x-leanlaw-partnerid appears in the OpenAPI, so a generated client will
  not expose them.
- The OAuth 2.1 surface is fully discoverable at runtime but is not represented in the OpenAPI
  securitySchemes, so spec-driven tooling sees only the bearer API key.
