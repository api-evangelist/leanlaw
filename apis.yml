aid: leanlaw
name: LeanLaw
description: >-
  LeanLaw is legal billing and revenue-operations software for small and mid-sized law firms, built
  natively on QuickBooks Online. It runs the full law-firm revenue lifecycle — time and expense
  tracking, matter management, trust/IOLTA accounting, flat-fee and contingency billing, invoicing,
  e-payments, LEDES output and compensation reporting — and keeps a real-time two-way sync with
  QuickBooks Online so invoices, payments, trust deposits and expenses post automatically. LeanLaw
  publishes a public REST API (v2) at api.leanlaw.io covering clients, matters, time entries,
  expenses, fixed fees, invoices, practice areas, custom fields, users and LEDES billing codes, with
  an OpenAPI 3.0.4 specification, a Zudoku-powered developer portal at platform.leanlaw.io, and a
  remote MCP server for AI assistants that is currently in private beta.
