apis:
- aid: leanlaw:leanlaw-api
  name: LeanLaw API
  description: >-
    The LeanLaw REST API (v2) provides programmatic access to a LeanLaw law-firm account — clients,
    matters, time entries, expenses, fixed fees, invoices, practice areas, custom field definitions,
    users, client balances and LEDES activity/task/expense codes. Requests are authenticated with a
    firm-scoped API key sent as an HTTP bearer token, responses are wrapped in a data envelope with
    limit/offset pagination, and PUT requests use sparse update semantics.
  humanURL: https://platform.leanlaw.io/start
  baseURL: https://api.leanlaw.io
