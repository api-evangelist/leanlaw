- aid: leanlaw:leanlaw-mcp
  name: LeanLaw MCP Server
  description: >-
    LeanLaw operates a remote Model Context Protocol server at https://api.leanlaw.io/mcp that lets an
    AI assistant work with a firm's clients, matters, time entries, expenses, fixed fees and invoices.
    It exposes the same operations as the REST API plus higher-level composite actions, is authorized
    per user via OAuth 2.1 against https://auth.myleanlaw.co/ with granular read/write scopes, and is
    in private beta enabled per firm on request.
  humanURL: https://platform.leanlaw.io/agents
  baseURL: https://api.leanlaw.io/mcp
  tags:
  - MCP
