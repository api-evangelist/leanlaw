domain_standards:
- id: ledes
  name: LEDES (Legal Electronic Data Exchange Standard)
  organization: LEDES Oversight Committee
  conforms: true
  evidence_type: contract
  evidence: >-
    The contract declares LEDES for itself, not just the marketing site. GET /v2/codes carries the
    summary "Get all LEDES codesets and codes" (operationId GetCodes, tag Codes) and returns
    CodeSet objects described as "Represents a set of LEDES codes within a category". The
    MatterLedesConfiguration schema — reachable from MatterDetail via select=ledesConfiguration —
    carries enabled, activityCodeRequired, taskCodeRequired, expenseCodeRequired and codeSetIds,
    binding LEDES activity/task/expense codes to time entries, fixed fees and expenses on a matter.
  spec_locations:
  - paths./v2/codes.get.summary
  - components.schemas.CodeSet.description
  - components.schemas.MatterLedesConfiguration
  - components.schemas.MatterDetail.properties.ledesConfiguration
  market_relevance: >-
    LEDES is the interchange format corporate legal departments and e-billing vendors require from
    outside counsel. A firm whose billing system speaks LEDES natively can invoice a corporate client
    without a bespoke connector; one that does not needs a bilateral mapping. LeanLaw also lists LEDES
    file output as a Pro-tier feature on its pricing page.
  scope: >-
    The API exposes LEDES code sets and per-matter LEDES requirements. LEDES FILE generation
    (1998B/2000/XML export) is a product feature per https://www.leanlaw.co/pricing/, not a published
    API operation.
